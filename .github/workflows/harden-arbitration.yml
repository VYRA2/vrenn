name: Endurecer arbitragem e validar build

on:
  push:
    branches:
      - fix/validated-automatic-outcomes
    paths:
      - scripts/harden_arbitration_ui.py
      - .github/workflows/harden-arbitration.yml
      - supabase/migrations/20260805100000_arbitration_appeals_and_hardening.sql

permissions:
  contents: write

jobs:
  harden-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: fix/validated-automatic-outcomes
          fetch-depth: 0

      - name: Aplicar correções de frontend
        run: python3 scripts/harden_arbitration_ui.py

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Validar build
        run: npm run build

      - name: Registrar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/duelo.$id.tsx
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional"
          else
            git commit -m "fix: corrige tela e remove escolha manual de árbitro"
            git push origin HEAD:fix/validated-automatic-outcomes
          fi
