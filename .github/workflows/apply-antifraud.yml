name: Aplicar correção antifraude

on:
  push:
    branches:
      - fix/validated-automatic-outcomes
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: fix/validated-automatic-outcomes
          fetch-depth: 0

      - name: Aplicar alterações
        run: python3 scripts/apply_antifraud.py

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install --ignore-scripts

      - name: Validar build
        run: npm run build

      - name: Registrar alterações na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: impede resultados manuais e valida provas no servidor"
          git push origin HEAD:fix/validated-automatic-outcomes
